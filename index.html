<!-- index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phần mềm phát hiện quấy rối Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Baloo 2', cursive; text-align: center; background: linear-gradient(to bottom, #a1c4fd, #c2e9fb); padding: 50px; }
    h1 { color: #ff3366; font-size: 28px; margin-bottom: 30px; }
    input { padding: 12px; font-size: 16px; width: 300px; border-radius: 8px; border: 1px solid #ccc; margin: 10px 0; }
    button { padding: 12px 25px; font-size: 16px; cursor: pointer; background-color: #ff6f61; color: white; border: none; border-radius: 8px; transition: 0.3s; }
    button:hover { background-color: #ff3b2f; }
    .sticker { width: 100px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Phần mềm phát hiện và cảnh báo Quấy rối tình dục trên không gian mạng</h1>
  <p>Xin chào! Vui lòng nhập số điện thoại phụ huynh:</p>
  <input type="text" id="phone" placeholder="Số điện thoại phụ huynh">
  <br>
  <button onclick="nextPage()">Tiếp tục</button>
  <div>
    <img src="https://i.ibb.co/0J7tKZK/emoji-sticker.png" class="sticker" alt="Sticker vui">
  </div>

  <script>
    function nextPage() {
      const phone = document.getElementById('phone').value.trim();
      if (!phone) { alert("Vui lòng nhập số điện thoại!"); return; }
      localStorage.setItem('parentPhone', phone);
      window.location.href = "analyze.html";
    }
  </script>
</body>
</html>
