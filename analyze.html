<!-- analyze.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phân tích tin nhắn</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Baloo 2', cursive; text-align: center; background: linear-gradient(to bottom, #fdfbfb, #ebedee); padding: 50px; }
textarea { width: 90%; height: 150px; font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-top: 20px; }
button { padding: 12px 25px; font-size: 16px; margin-top: 15px; cursor: pointer; background-color: #ff6f61; color: white; border: none; border-radius: 8px; transition: 0.3s; }
button:hover { background-color: #ff3b2f; }
#result { margin-top: 20px; font-weight: bold; font-size: 18px; }
.sticker { width: 80px; margin-top: 20px; }
</style>
</head>
<body>
<h1>Phân tích tin nhắn/hình ảnh</h1>
<p>Nhập nội dung tin nhắn từ đối phương:</p>
<textarea id="message" placeholder="Nhập tin nhắn ở đây..."></textarea>
<br>
<button onclick="analyzeMessage()">Phân tích</button>
<div id="result"></div>
<img src="https://i.ibb.co/d5QWj4D/cute-sticker.png" class="sticker" alt="Sticker vui">

<script>
// Mẫu từ/câu quấy rối (ví dụ mở rộng, bạn có thể thêm tiếp)
const offensiveWords = [
"sex","ảnh nóng","khiêu dâm","quấy rối","muốn gặp","gợi cảm","gợi dục","ảnh riêng tư","đồ chơi tình dục","sexting",
"thân mật","nóng bỏng","tắm cùng","ôm","hôn","đụ","yêu","thích ngực","thích mông","ảnh nhạy cảm",
"đặt tay","gạ tình","quấy rối tình dục","lộ hàng","video nóng","chat sex","nhạy cảm","muốn xxx",
"thích xxx","ảnh sex","gạ sex","đưa ảnh","thủ dâm","quan hệ","quan hệ tình dục","cởi đồ","ảnh khỏa thân"
];
// Có thể nhân bản lên tới 1000 từ/câu

function analyzeMessage() {
  const msg = document.getElementById('message').value.toLowerCase();
  const found = offensiveWords.some(word => msg.includes(word));
  if (found) {
    window.location.href = "alert.html";
  } else {
    document.getElementById('result').innerText = "Nội dung an toàn, lành mạnh";
  }
}
</script>
</body>
</html>
